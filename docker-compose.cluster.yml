version: '3.8'

services:
  gateway-a:
    build: .
    container_name: memoryos-gateway-a
    ports:
      - "8081:8080"
    environment:
      - MEMORYOS__REDIS__URL=redis://redis:6379
      - MEMORYOS__QDRANT__URL=http://qdrant:6334
      - MEMORYOS__LLM__API_KEY=${MEMORYOS_LLM_API_KEY:-not-needed}
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  gateway-b:
    build: .
    container_name: memoryos-gateway-b
    ports:
      - "8082:8080"
    environment:
      - MEMORYOS__REDIS__URL=redis://redis:6379
      - MEMORYOS__QDRANT__URL=http://qdrant:6334
      - MEMORYOS__LLM__API_KEY=${MEMORYOS_LLM_API_KEY:-not-needed}
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
