[server]
host = "0.0.0.0"
port = 8080
worker_threads = 4
timeout_seconds = 60

[llm]
default_provider = "openai"
default_model = "gpt-4o-mini"

[llm.providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[storage.redis]
url = "redis://127.0.0.1:6379"
ttl_seconds = 3600
max_messages = 20

[storage.vector]
url = "http://127.0.0.1:6334"

[router]
enable = false
hot_threshold = 0.7
max_local_tokens = 2000
local_backends = []
sensitive_keywords = []

[embedding]
# api_key_env = "OPENAI_API_KEY"
# base_url = "https://api.openai.com/v1"
# model = "text-embedding-3-small"

[auth]
enabled = false
# Generate your own keys before deploying to production:
#   openssl rand -hex 32
# admin_keys = ["your-admin-key"]
# api_keys = ["your-api-key"]
