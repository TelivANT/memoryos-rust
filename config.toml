[server]
host = "0.0.0.0"
port = 8080
worker_threads = 4
timeout_seconds = 60

[llm]
default_provider = "gemini"
default_model = "gemini-3-pro-preview"

[llm.providers.gemini]
type = "gemini"
api_key = "<YOUR_GEMINI_API_KEY>"
base_url = "<YOUR_GEMINI_BASE_URL>"  # e.g., http://your-server:3000/gemini

[storage.redis]
url = "redis://127.0.0.1:6379"

[storage.vector]
url = "http://127.0.0.1:6334"

[router]
enable = false
hot_threshold = 0.7
max_local_tokens = 2000
local_backends = []
sensitive_keywords = []

[embedding]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "text-embedding-3-small"

# API Key authentication
# Generate your own keys before deploying to production:
#   openssl rand -hex 32
[auth]
enabled = true
api_keys = [
    "REPLACE_WITH_YOUR_OWN_KEY"
]
