[server]
host = "0.0.0.0"
port = 8080
worker_threads = 4
timeout_seconds = 60

[llm]
provider = "openai"
api_key = "sk-test-key-replace-me"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# Supported providers:
# - openai        (base_url: https://api.openai.com/v1)
# - gemini        (base_url: https://generativelanguage.googleapis.com/v1beta)
# - claude        (base_url: https://api.anthropic.com/v1)
# - ollama        (base_url: http://localhost:11434/v1)
# - deepseek      (base_url: https://api.deepseek.com/v1)
# - openrouter    (base_url: https://openrouter.ai/api/v1)
# - azure-openai  (base_url: https://{resource}.openai.azure.com)

[redis]
url = "redis://localhost:6379"
ttl_seconds = 3600
max_messages = 20

[qdrant]
url = "http://localhost:6334"

# Embedding configuration (optional)
# If not configured, will use fallback simple embedding
[embedding]
