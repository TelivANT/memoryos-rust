[server]
host = "0.0.0.0"
port = 8080
worker_threads = 4
timeout_seconds = 60

[llm]
provider = "openai"
api_key = "sk-test-key-replace-me"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# Supported providers:
# - openai        (base_url: https://api.openai.com/v1)
# - gemini        (base_url: https://generativelanguage.googleapis.com/v1beta)
# - claude        (base_url: https://api.anthropic.com/v1)
# - ollama        (base_url: http://localhost:11434/v1)
# - deepseek      (base_url: https://api.deepseek.com/v1)
# - openrouter    (base_url: https://openrouter.ai/api/v1)
# - azure-openai  (base_url: https://{resource}.openai.azure.com)

[redis]
url = "redis://localhost:6379"
ttl_seconds = 3600
max_messages = 20

[qdrant]
url = "http://localhost:6334"

# Embedding configuration (optional)
# If not configured, will use fallback simple embedding
[embedding]
# provider = "openai"  # Currently only openai-compatible APIs supported
# api_key = "sk-your-embedding-key"  # Or set OPENAI_API_KEY env var
# base_url = "https://api.openai.com/v1"
# model = "text-embedding-3-small"

# Authentication configuration
[auth]
enabled = false
admin_keys = []  # Admin API keys for management endpoints
api_keys = []    # Regular API keys for normal endpoints
use_redis_store = false  # Use Qdrant for API key storage

# IP Defense System configuration
[defense]
enabled = true
redis_url = "redis://localhost:6379"
qdrant_url = "http://localhost:6334"

# Attack thresholds (requests per time window)
[defense.thresholds]
auth_failure = { limit = 5, window_secs = 60, ban_duration_secs = 900 }      # 5/min → 15min ban
rate_limit = { limit = 100, window_secs = 60, ban_duration_secs = 300 }      # 100/min → 5min ban
prompt_injection = { limit = 3, window_secs = 3600, ban_duration_secs = 3600 } # 3/hour → 1hour ban
scraping = { limit = 200, window_secs = 60, ban_duration_secs = 1800 }       # 200/min → 30min ban
ddos = { limit = 500, window_secs = 60, ban_duration_secs = 0 }              # 500/min → permanent ban
