apiVersion: v1
kind: Namespace
metadata:
  name: memoryos

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memoryos-config
  namespace: memoryos
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080
    worker_threads = 4
    timeout_seconds = 60

    [llm]
    provider = "openai"
    api_key = "placeholder"
    base_url = "https://api.openai.com/v1"
    model = "gpt-4o-mini"

    [redis]
    url = "redis://redis.example.internal:6379"
    ttl_seconds = 3600
    max_messages = 20

    [qdrant]
    # Qdrant client path in this project is gRPC; use 6334.
    url = "http://qdrant.example.internal:6334"

---
apiVersion: v1
kind: Secret
metadata:
  name: memoryos-secrets
  namespace: memoryos
type: Opaque
stringData:
  llm-api-key: "REPLACE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryos-gateway
  namespace: memoryos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memoryos-gateway
  template:
    metadata:
      labels:
        app: memoryos-gateway
    spec:
      containers:
      - name: gateway
        image: memoryos:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MEMORYOS__LLM__API_KEY
          valueFrom:
            secretKeyRef:
              name: memoryos-secrets
              key: llm-api-key
        # Production mode: middleware/infra are expected to be external/hosted.
        - name: MEMORYOS__REDIS__URL
          value: "redis://redis.example.internal:6379"
        - name: MEMORYOS__QDRANT__URL
          value: "http://qdrant.example.internal:6334"
        volumeMounts:
        - name: config
          mountPath: /app/config.toml
          subPath: config.toml
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: memoryos-config

---
apiVersion: v1
kind: Service
metadata:
  name: memoryos-gateway
  namespace: memoryos
spec:
  selector:
    app: memoryos-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memoryos-gateway-hpa
  namespace: memoryos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memoryos-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
