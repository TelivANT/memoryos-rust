version: '3.8'

services:
  # Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoryos-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - memoryos-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (Optional - for coordination)
  redis:
    image: redis:7-alpine
    container_name: memoryos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - memoryos-backend
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NATS (Optional - for message queue)
  nats:
    image: nats:latest
    container_name: memoryos-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - memoryos-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MemoryOS Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: memoryos-gateway
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - VECTOR_STORAGE_TYPE=qdrant
      - VECTOR_STORAGE_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - qdrant
      - redis
      - nats
    networks:
      - memoryos-frontend
      - memoryos-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MemoryOS Worker (Optional)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: memoryos-worker
    environment:
      - RUST_LOG=info
      - VECTOR_STORAGE_TYPE=qdrant
      - VECTOR_STORAGE_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - qdrant
      - redis
      - nats
    networks:
      - memoryos-backend
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: memoryos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - memoryos-backend
      - memoryos-frontend
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: memoryos-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/memoryos.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - memoryos-frontend
    restart: unless-stopped

  # Redis Exporter (for Prometheus)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: memoryos-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - memoryos-backend
    restart: unless-stopped

networks:
  memoryos-frontend:
    driver: bridge
  memoryos-backend:
    driver: bridge
    internal: true

volumes:
  qdrant_storage:
  redis_data:
  prometheus_data:
  grafana_data:
