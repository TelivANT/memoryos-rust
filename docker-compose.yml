services:
  # Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoryos-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - memoryos-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: memoryos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - memoryos-backend
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS (message queue, optional - needed for async memory pipeline)
  nats:
    image: nats:latest
    container_name: memoryos-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - memoryos-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

  # MemoryOS Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoryos-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=info
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - memoryos-frontend
      - memoryos-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # MemoryOS Worker (optional, for async memory pipeline)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: memoryos-worker
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=info
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - memoryos-backend
    restart: unless-stopped
    profiles:
      - full

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: memoryos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - memoryos-backend
      - memoryos-frontend
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: memoryos-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/memoryos.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - memoryos-frontend
    restart: unless-stopped
    profiles:
      - monitoring

  # Redis Exporter (for Prometheus)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: memoryos-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - memoryos-backend
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  memoryos-frontend:
    driver: bridge
  memoryos-backend:
    driver: bridge
    internal: true

volumes:
  qdrant_storage:
  redis_data:
  prometheus_data:
  grafana_data:
