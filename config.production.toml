# MemoryOS Production Configuration
# Copy this file to config.toml and fill in your values.
# All API keys should be set via environment variables (api_key_env) in production.

[server]
host = "0.0.0.0"
port = 8080
worker_threads = 4
timeout_seconds = 60

[llm]
default_provider = "openai"
default_model = "gpt-4o-mini"

[llm.providers.openai]
type = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"

# Add more providers as needed:
# [llm.providers.claude]
# type = "claude"
# api_key_env = "ANTHROPIC_API_KEY"
# base_url = "https://api.anthropic.com/v1"

[storage.redis]
url = "redis://redis:6379"
ttl_seconds = 3600
max_messages = 20

[storage.vector]
url = "http://qdrant:6334"

[router]
enable = true
hot_threshold = 0.7
max_local_tokens = 2000
local_backends = []
sensitive_keywords = []

[embedding]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
model = "text-embedding-3-small"

[auth]
enabled = true
# Generate keys: openssl rand -hex 32
admin_keys = []  # REQUIRED: add at least one admin key
api_keys = []    # REQUIRED: add at least one API key
