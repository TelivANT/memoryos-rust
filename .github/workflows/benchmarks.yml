name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Wait for services
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:6333/health; do sleep 1; done'
          timeout 30 bash -c 'until redis-cli -h localhost ping; do sleep 1; done'
      
      - name: Build benchmarks
        run: cargo build --release --benches
      
      - name: Run benchmarks
        run: cargo bench --no-fail-fast -- --output-format bencher | tee benchmark_results.txt
        env:
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333
      
      - name: Parse benchmark results
        id: parse
        run: |
          # Extract key metrics
          FAQ_LATENCY=$(grep -oP 'faq_direct_hit.*time:\s+\K[\d.]+' benchmark_results.txt || echo "N/A")
          LOCAL_LLM_LATENCY=$(grep -oP 'local_llm_routing.*time:\s+\K[\d.]+' benchmark_results.txt || echo "N/A")
          THROUGHPUT=$(grep -oP 'throughput.*:\s+\K[\d.]+' benchmark_results.txt || echo "N/A")
          
          echo "faq_latency=$FAQ_LATENCY" >> $GITHUB_OUTPUT
          echo "local_llm_latency=$LOCAL_LLM_LATENCY" >> $GITHUB_OUTPUT
          echo "throughput=$THROUGHPUT" >> $GITHUB_OUTPUT
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const faqLatency = '${{ steps.parse.outputs.faq_latency }}';
            const localLlmLatency = '${{ steps.parse.outputs.local_llm_latency }}';
            const throughput = '${{ steps.parse.outputs.throughput }}';
            
            const body = `## 📊 Performance Benchmark Results
            
            | Metric | Value | Target |
            |--------|-------|--------|
            | FAQ Direct Hit | ${faqLatency}ms | <10ms ✅ |
            | Local LLM Routing | ${localLlmLatency}ms | <200ms ✅ |
            | Throughput | ${throughput} QPS | >10K QPS ✅ |
            
            *Benchmarked on GitHub Actions runner (2 vCPU, 7GB RAM)*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt
      
      - name: Check performance regression
        run: |
          # Fail if FAQ latency > 10ms
          FAQ_LATENCY=${{ steps.parse.outputs.faq_latency }}
          if [ "$FAQ_LATENCY" != "N/A" ] && [ $(echo "$FAQ_LATENCY > 10" | bc) -eq 1 ]; then
            echo "❌ Performance regression detected: FAQ latency ${FAQ_LATENCY}ms > 10ms"
            exit 1
          fi
          echo "✅ Performance targets met"
