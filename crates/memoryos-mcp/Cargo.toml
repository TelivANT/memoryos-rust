[package]
name = "memoryos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server for MemoryOS"

[[bin]]
name = "memoryos-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "0.3", features = ["server", "transport-io", "transport-sse-server"] }

# Workspace deps
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Internal crates
memoryos-core = { path = "../memoryos-core" }
memoryos-ports = { path = "../memoryos-ports" }
memoryos-adapters = { path = "../memoryos-adapters" }
